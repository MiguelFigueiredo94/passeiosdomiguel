<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Lateral - Passeios do Miguel</title>
    
    <!-- FontAwesome 6 & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #1e4d8c;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 75px;
            --primary-accent: #ff8c00;
            --primary-accent-hover: #e67e00;
            --text-color-light: #ffffff;
            --text-color-muted: rgba(255, 255, 255, 0.7);
            --item-hover-bg: rgba(255, 255, 255, 0.12);
            --transition-speed: 0.3s;
            --shadow-glow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent;
            overflow-x: hidden;
        }

        /* ESTRUTURA PRINCIPAL DO MENU LATERAL */
        #menu-lateral {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            min-height: 100vh;
            height: 100%;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            z-index: 99999;
            transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        /* MODO COLAPSADO */
        #menu-lateral.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* BOTÃO COLLAPSE TOGGLE */
        .collapse-toggle-btn {
            position: absolute;
            top: 22px;
            right: -15px;
            width: 30px;
            height: 30px;
            background: var(--primary-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform var(--transition-speed) ease, background var(--transition-speed) ease;
            z-index: 10001;
            border: 2px solid white;
        }

        .collapse-toggle-btn:hover {
            background: var(--primary-accent-hover);
            transform: scale(1.15);
        }

        #menu-lateral.collapsed .collapse-toggle-btn i {
            transform: rotate(180deg);
        }

        /* LOGÓTIPO */
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 10px auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            background-color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            flex-shrink: 0;
            position: relative;
        }

        .logo-container .logo {
            width: 115%;
            height: auto;
            object-fit: contain;
            display: block;
            transform: translateY(3px);
            transition: transform 0.3s ease;
        }

        .logo-container:hover .logo {
            transform: translateY(3px) scale(1.05);
        }

        #menu-lateral.collapsed .logo-container {
            width: 48px;
            height: 48px;
            margin: 10px auto 25px;
            border-width: 2px;
        }

        /* LISTA DO MENU */
        #menu-lateral ul.menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #menu-lateral ul.menu-list::-webkit-scrollbar {
            width: 4px;
        }
        #menu-lateral ul.menu-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
        }

        #menu-lateral li {
            position: relative;
        }

        /* LINKS DO MENU COM ANIMAÇÕES DE BRILHO */
        #menu-lateral ul li a.menu-link {
            display: flex;
            align-items: center;
            color: var(--text-color-light);
            text-decoration: none;
            padding: 12px 16px;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            position: relative;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Efeito Glow / Shimmer no Hover */
        #menu-lateral ul li a.menu-link::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        #menu-lateral ul li a.menu-link:hover::after {
            left: 100%;
        }

        #menu-lateral ul li a.menu-link:hover {
            background: var(--item-hover-bg);
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }

        /* ITEM ATIVO COM DESTAQUE DINÂMICO */
        #menu-lateral ul li a.menu-link.active,
        #menu-lateral ul li.active > a.menu-link {
            background: linear-gradient(135deg, var(--primary-accent), var(--primary-accent-hover)) !important;
            color: white !important;
            font-weight: 600;
            box-shadow: var(--shadow-glow);
        }

        #menu-lateral ul li a.menu-link.active::before,
        #menu-lateral ul li.active > a.menu-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 65%;
            background: white;
            border-radius: 0 4px 4px 0;
        }

        .main-icon {
            width: 24px;
            text-align: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .link-text {
            margin-left: 12px;
            opacity: 1;
            transition: opacity 0.2s ease;
            flex-grow: 1;
        }

        .fa-chevron-right {
            margin-left: auto;
            font-size: 11px;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .dropdown.open .fa-chevron-right {
            transform: rotate(90deg);
        }

        /* DROPDOWNS / SUBMENUS FLUIDOS */
        .dropdown-content {
            display: none;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 10px;
            padding: 6px;
            margin-top: 5px;
            margin-left: 10px;
            border-left: 2px solid var(--primary-accent);
        }

        .dropdown.open .dropdown-content {
            display: block;
            animation: fadeInSubmenu 0.3s ease forwards;
        }

        @keyframes fadeInSubmenu {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-content a {
            color: var(--text-color-muted) !important;
            padding: 9px 14px !important;
            display: flex !important;
            align-items: center !important;
            text-decoration: none !important;
            font-size: 13.5px !important;
            font-weight: 400 !important;
            transition: all 0.2s ease !important;
            border-radius: 8px !important;
            background: transparent !important;
            margin-bottom: 2px;
        }

        .dropdown-content a:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.12) !important;
            padding-left: 18px !important;
        }

        .dropdown-content a.active {
            color: var(--primary-accent) !important;
            background: rgba(255, 255, 255, 0.15) !important;
            font-weight: 600 !important;
        }

        /* MODO COLAPSADO - REGRAS DE EXCLUSÃO DE TEXTO */
        #menu-lateral.collapsed .link-text,
        #menu-lateral.collapsed .fa-chevron-right,
        #menu-lateral.collapsed .redes-sociais-menu p {
            display: none;
            opacity: 0;
        }

        #menu-lateral.collapsed ul li a.menu-link {
            justify-content: center;
            padding: 14px 0;
        }

        #menu-lateral.collapsed .main-icon {
            margin: 0;
        }

        /* TOOLTIP NO MODO COLAPSADO */
        .tooltip {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%) translateX(10px);
            background: #0d1b2a;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 10002;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            right: 100%;
            top: 50%;
            transform: translateY(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: transparent #0d1b2a transparent transparent;
        }

        #menu-lateral.collapsed li:hover .tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(-50%) translateX(15px);
        }

        /* SUBMENU DROPDOWN NO MODO COLAPSADO */
        #menu-lateral.collapsed .dropdown-content {
            position: absolute;
            left: 100%;
            top: 0;
            margin: 0 0 0 12px;
            background: #1e4d8c;
            min-width: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10001;
        }

        /* REDES SOCIAIS COM ANIMAÇÃO BOUNCE / ROTATION */
        .redes-sociais-menu {
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.12);
            text-align: center;
            margin-top: auto;
        }

        .redes-sociais-menu p {
            color: var(--text-color-muted);
            font-size: 11px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .icones-redes {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .icones-redes a {
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }

        /* Animações Individuais nas Redes */
        .icones-redes a.facebook:hover {
            background: #1877f2;
            transform: translateY(-50%) scale(1.15) rotate(8deg);
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4);
        }

        .icones-redes a.instagram:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            transform: translateY(-5px) scale(1.15) rotate(-8deg);
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4);
        }

        .icones-redes a.whatsapp:hover {
            background: #25d366;
            transform: translateY(-5px) scale(1.15) rotate(8deg);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        #menu-lateral.collapsed .icones-redes {
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #menu-lateral.collapsed .icones-redes a {
            width: 32px;
            height: 32px;
            font-size: 14px;
        }

        /* RESPONSIVIDADE MOBILE (COMPACT/DRAWER) */
        @media (max-width: 1024px) {
            #menu-lateral {
                transform: translateX(-100%);
                width: 270px !important;
            }

            #menu-lateral.mobile-open {
                transform: translateX(0);
            }

            .collapse-toggle-btn {
                display: none;
            }

            #menu-lateral .link-text,
            #menu-lateral .fa-chevron-right,
            #menu-lateral .redes-sociais-menu p {
                display: block !important;
                opacity: 1 !important;
            }

            #menu-lateral .logo-container {
                width: 110px !important;
                height: 110px !important;
            }

            #menu-lateral ul li a.menu-link {
                justify-content: flex-start !important;
                padding: 12px 16px !important;
            }
        }
    </style>
</head>
<body>

    <!-- MENU LATERAL ISOLADO -->
    <nav id="menu-lateral">
        <!-- BOTÃO PARA MINIMIZAR / COLAPSAR -->
        <div class="collapse-toggle-btn" id="collapseBtn" title="Minimizar Menu">
            <i class="fas fa-chevron-left"></i>
        </div>

        <!-- LOGÓTIPO -->
        <a href="index.html" class="logo-container">
            <img src="https://i.imgur.com/X1xT7Fx.png" class="logo" alt="Passeios do Miguel">
        </a>

        <!-- LISTA DE NAVEGAÇÃO -->
        <ul class="menu-list">
            <li>
                <a href="index.html" class="menu-link">
                    <i class="fas fa-home main-icon"></i>
                    <span class="link-text">Home</span>
                </a>
                <div class="tooltip">Home</div>
            </li>

            <li>
                <a href="sobre.html" class="menu-link">
                    <i class="fas fa-user main-icon"></i>
                    <span class="link-text">Sobre Mim</span>
                </a>
                <div class="tooltip">Sobre Mim</div>
            </li>

            <!-- DROPDOWN DE PASSEIOS E GALERIA -->
            <li class="dropdown">
                <a href="passeios.html" class="menu-link">
                    <i class="fas fa-bus main-icon"></i>
                    <span class="link-text">Passeios</span>
                    <i class="fas fa-chevron-right"></i>
                </a>
                <div class="tooltip">Passeios</div>
                <div class="dropdown-content">
                    <a href="passeios.html"><i class="fas fa-list-ul" style="margin-right:8px;"></i> Ver Todos os Passeios</a>
                    <a href="galeria.html"><i class="fas fa-camera" style="margin-right:8px;"></i> Exposição de Fotos</a>
                </div>
            </li>

            <li>
                <a href="contactos.html" class="menu-link">
                    <i class="fas fa-envelope main-icon"></i>
                    <span class="link-text">Contactos</span>
                </a>
                <div class="tooltip">Contactos</div>
            </li>

            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.12); margin: 6px 0;">

            <li>
                <a href="dicas.html" class="menu-link">
                    <i class="fas fa-lightbulb main-icon"></i>
                    <span class="link-text">Dicas Úteis</span>
                </a>
                <div class="tooltip">Dicas Úteis</div>
            </li>

            <li>
                <a href="faq.html" class="menu-link">
                    <i class="fas fa-question-circle main-icon"></i>
                    <span class="link-text">FAQ</span>
                </a>
                <div class="tooltip">FAQ</div>
            </li>
        </ul>

        <!-- REDES SOCIAIS -->
        <div class="redes-sociais-menu">
            <p>Siga-nos</p>
            <div class="icones-redes">
                <a href="https://www.facebook.com/passeiosdomiguel" target="_blank" class="facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/passeiosdomiguel/" target="_blank" class="instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://chat.whatsapp.com/GOsICa89IntAlMqS9ydUzJ" target="_blank" class="whatsapp" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuLateral = document.getElementById('menu-lateral');
            const collapseBtn = document.getElementById('collapseBtn');
            const dropdowns = document.querySelectorAll('.dropdown');
            const allLinks = document.querySelectorAll('#menu-lateral a');

            // 1. LÓGICA AUTOMÁTICA DE PÁGINA ATIVA
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            const currentHash = window.location.hash;

            allLinks.forEach(link => {
                const linkHref = link.getAttribute('href');
                if (!linkHref) return;

                // Comparação precisa de URL/Arquivo ou Ancora (#)
                if (linkHref === currentPath || (currentHash && linkHref.includes(currentHash))) {
                    link.classList.add('active');
                    
                    // Se estiver dentro de um dropdown, abre o submenu pai e destaca-o
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.classList.add('open');
                        const parentMenuLink = parentDropdown.querySelector('.menu-link');
                        if (parentMenuLink) parentMenuLink.classList.add('active');
                    }
                }
            });

            // 2. TOGGLE PARA MINIMIZAR / EXPANDIR O MENU
            if (collapseBtn) {
                collapseBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    menuLateral.classList.toggle('collapsed');
                    
                    // Fechar dropdowns abertos ao recolher para manter limpo
                    if (menuLateral.classList.contains('collapsed')) {
                        dropdowns.forEach(d => d.classList.remove('open'));
                    }
                });
            }

            // 3. NAVEGAÇÃO E ACESSOS DE SUBMENU (DROPDOWNS)
            dropdowns.forEach(dropdown => {
                const dropdownToggle = dropdown.querySelector('.menu-link');
                
                dropdownToggle.addEventListener('click', function(e) {
                    // Se o item tem links para navegação normal, deixa navegar se não for link vazio
                    const href = this.getAttribute('href');
                    if (!href || href === '#' || href === 'javascript:void(0);') {
                        e.preventDefault();
                    }

                    // Se estiver colapsado, expande primeiro
                    if (menuLateral.classList.contains('collapsed') && window.innerWidth > 1024) {
                        menuLateral.classList.remove('collapsed');
                    }

                    const isOpen = dropdown.classList.contains('open');
                    
                    // Fechar outros dropdowns
                    dropdowns.forEach(d => d.classList.remove('open'));

                    // Alternar o atual
                    if (!isOpen) {
                        dropdown.classList.add('open');
                    }
                });
            });
        });
    </script>
</body>
</html>
