<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposição Virtual - Diário de Bordo | Passeios do Miguel</title>
    
    <!-- CSS Bootstrap, GLightbox e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff8c00;
            --museum-wall: #1a1a1a;
            --museum-card: #262626;
            --gold-accent: #d4af37;
            --text-light: #f5f5f5;
        }

        body {
            background-color: var(--museum-wall);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(#333 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Áudio Guia / Controle de Som */
        .audio-guide-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-accent);
            border-radius: 30px;
            padding: 8px 18px;
            backdrop-filter: blur(5px);
        }

        /* Molduras do Museu (Museum Frames) */
        .museum-frame {
            position: relative;
            background: var(--museum-card);
            border: 8px solid #333;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            overflow: hidden;
        }

        /* Efeito de Foco de Luz (Spotlight) */
        .museum-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 3;
        }

        /* Efeito Hover: Tilt 3D + Elevação + Foco de Luz */
        .museum-frame:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(-2deg) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 
                        0 0 25px rgba(255, 140, 0, 0.3);
            border-color: var(--gold-accent);
        }

        .museum-frame:hover::before {
            opacity: 1;
        }

        .museum-frame img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .museum-frame:hover img {
            transform: scale(1.05);
        }

        /* Placa Informativa do Museu */
        .plaque {
            background: linear-gradient(145deg, #2b2b2b, #1f1f1f);
            border-top: 2px solid var(--gold-accent);
            padding: 15px;
            text-align: center;
        }

        .plaque-title {
            color: var(--gold-accent);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .plaque-date {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Esconder fotos extra da galeria GLightbox */
        .hidden-gallery {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho & Controlo de Áudio Guia -->
    <header class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="h2 mb-0 text-warning"><i class="fa-solid fa-building-columns me-2"></i>Exposição Virtual</h1>
                <p class="text-muted mb-0">Diário de Bordo - Passeios do Miguel</p>
            </div>
            
            <!-- Painel Áudio Guia -->
            <div class="audio-guide-panel d-flex align-items-center gap-3">
                <span class="small text-gold"><i class="fa-solid fa-headphones me-1"></i> Áudio Guia</span>
                <button id="btn-ambient-sound" class="btn btn-sm btn-outline-warning rounded-circle">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Elementos de Áudio -->
    <audio id="audio-ambient" loop src="https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3"></audio>
    <audio id="audio-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <!-- Exposição de Fotografias -->
    <main class="container my-5">
        <div class="row g-4">
            
            <!-- Quadro 1 -->
            <div class="col-md-6 col-lg-4">
                <div class="museum-frame">
                    <a href="https://picsum.photos/1200/800?random=1" class="glightbox" data-gallery="excursao-1" data-title="Excursão a Fátima e Pia do Urso">
                        <img src="https://picsum.photos/600/400?random=1" alt="Fátima e Pia do Urso">
                    </a>
                    <div class="plaque">
                        <div class="plaque-title">Fátima & Pia do Urso</div>
                        <div class="plaque-date"><i class="fa-regular fa-calendar me-1"></i>Outubro 2026</div>
                    </div>
                    <!-- Fotos Adicionais da Coleção -->
                    <div class="hidden-gallery">
                        <a href="https://picsum.photos/1200/800?random=11" class="glightbox" data-gallery="excursao-1"></a>
                        <a href="https://picsum.photos/1200/800?random=12" class="glightbox" data-gallery="excursao-1"></a>
                    </div>
                </div>
            </div>

            <!-- Quadro 2 -->
            <div class="col-md-6 col-lg-4">
                <div class="museum-frame">
                    <a href="https://picsum.photos/1200/800?random=2" class="glightbox" data-gallery="excursao-2" data-title="Magusto em Santoinho e Viana do Castelo">
                        <img src="https://picsum.photos/600/400?random=2" alt="Santoinho">
                    </a>
                    <div class="plaque">
                        <div class="plaque-title">Magusto em Santoinho</div>
                        <div class="plaque-date"><i class="fa-regular fa-calendar me-1"></i>Novembro 2026</div>
                    </div>
                    <div class="hidden-gallery">
                        <a href="https://picsum.photos/1200/800?random=21" class="glightbox" data-gallery="excursao-2"></a>
                    </div>
                </div>
            </div>

            <!-- Quadro 3 -->
            <div class="col-md-6 col-lg-4">
                <div class="museum-frame">
                    <a href="https://picsum.photos/1200/800?random=3" class="glightbox" data-gallery="excursao-3" data-title="Mercados de Natal em Salamanca">
                        <img src="https://picsum.photos/600/400?random=3" alt="Salamanca">
                    </a>
                    <div class="plaque">
                        <div class="plaque-title">Salamanca & Ciudad Rodrigo</div>
                        <div class="plaque-date"><i class="fa-regular fa-calendar me-1"></i>Dezembro 2026</div>
                    </div>
                    <div class="hidden-gallery">
                        <a href="https://picsum.photos/1200/800?random=31" class="glightbox" data-gallery="excursao-3"></a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts: Bootstrap, GLightbox e Áudio Guia -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        // Inicialização da Galeria GLightbox
        const lightbox = GLightbox({
            touchNavigation: true,
            loop: true,
            autoplayVideos: true
        });

        // Controlo do Áudio Guia (Som de Fundo)
        const audioAmbient = document.getElementById('audio-ambient');
        const audioClick = document.getElementById('audio-click');
        const btnAmbient = document.getElementById('btn-ambient-sound');
        let isPlaying = false;

        btnAmbient.addEventListener('click', () => {
            if (isPlaying) {
                audioAmbient.pause();
                btnAmbient.innerHTML = '<i class="fa-solid fa-play"></i>';
            } else {
                audioAmbient.volume = 0.3; // Volume suave de fundo
                audioAmbient.play();
                btnAmbient.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        });

        // Efeito Sonoro de "Click de Fotografia" ao Selecionar uma Moldura
        document.querySelectorAll('.museum-frame a').forEach(item => {
            item.addEventListener('click', () => {
                audioClick.currentTime = 0;
                audioClick.volume = 0.5;
                audioClick.play();
            });
        });
    </script>
</body>
</html>
